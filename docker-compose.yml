services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      HTTP_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ai_agent
      DATABASE_USER: ai_agent
      DATABASE_PASSWORD: ai_agent
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/ai_agent
      DATABASE_POOL_SIZE: 10
      AI_STEP_DELAY_MS: 150
      AI_TIMEOUT_MS: 7000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
